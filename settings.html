<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>YouTube Chat Overlay 設定</title>
<style>
  body {
    margin: 0;
    padding: 12px;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    background: #1e1e2f;
    color: #f5f5f5;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 12px;
    height: calc(100vh - 24px);
    overflow: hidden;
  }

  .left-panel {
    flex: 0 0 240px;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .right-panel {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
  }

  .settings-row {
    display: flex;
    gap: 10px;
  }

  .settings-col {
    flex: 1;
    min-width: 0;
  }

  h1 {
    font-size: 18px;
    margin: 0 0 8px 0;
  }

  label {
    display: block;
    margin-top: 8px;
    font-size: 13px;
  }

  input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    margin-top: 4px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #2a2a3d;
    color: #f5f5f5;
    box-sizing: border-box;
  }

  .buttons {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    padding: 6px 0;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }

  #btnStart {
    background: #4caf50;
    color: #fff;
  }

  #btnStop {
    background: #f44336;
    color: #fff;
  }

  #status {
    margin-top: 8px;
    font-size: 12px;
  }

  .small {
    font-size: 10px;
    color: #ccccff;
    margin-top: 6px;
  }

  #launchersBox {
    margin-top: 10px;
    padding: 6px;
    border-radius: 6px;
    background: #25253a;
    font-size: 10px;
  }

  #launchersBox code {
    background: #333;
    padding: 1px 3px;
    border-radius: 3px;
  }

  #btnOpenLaunchers {
    margin-top: 4px;
    padding: 3px 6px;
    font-size: 10px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background: #3f51b5;
    color: #fff;
  }

  .color-settings {
    padding: 10px;
    background: #25253a;
    border-radius: 8px;
    box-sizing: border-box;
    margin-bottom: 10px;
  }

  .color-settings h2 {
    font-size: 14px;
    margin: 0 0 8px 0;
    border-bottom: 1px solid #444;
    padding-bottom: 6px;
  }

  .color-row {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
  }

  .color-row label {
    flex: 1;
    margin: 0;
    font-size: 12px;
    min-width: 90px;
  }

  .color-row input[type="color"] {
    width: 32px;
    height: 24px;
    padding: 0;
    border: 2px solid #555;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
  }

  .color-row input[type="number"] {
    width: 50px;
    padding: 3px 5px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #2a2a3d;
    color: #f5f5f5;
    font-size: 11px;
  }

  .color-row input[type="range"] {
    width: 60px;
    cursor: pointer;
  }

  .color-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .color-row select {
    flex: 1;
    max-width: 150px;
    padding: 3px 5px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #2a2a3d;
    color: #f5f5f5;
    font-size: 11px;
    cursor: pointer;
  }

  .alpha-value {
    font-size: 10px;
    color: #aaa;
    width: 30px;
    text-align: right;
  }

  #btnResetColors,
  #btnResetSupers,
  #btnResetNico {
    margin-top: 8px;
    padding: 5px 10px;
    font-size: 11px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background: #666;
    color: #fff;
  }

  #btnResetColors:hover,
  #btnResetSupers:hover,
  #btnResetNico:hover {
    background: #888;
  }

  .color-category {
    margin-top: 10px;
    font-size: 11px;
    color: #aaa;
    border-top: 1px solid #333;
    padding-top: 6px;
  }

  .color-category:first-of-type {
    margin-top: 0;
    border-top: none;
    padding-top: 0;
  }

  .effect-box {
    margin-top: 12px;
    padding: 8px;
    border-radius: 8px;
    background: #25253a;
    font-size: 12px;
  }
  .effect-box h2 {
    margin: 0 0 6px 0;
    font-size: 14px;
  }
  .effect-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  .effect-buttons button {
    padding: 8px 6px;
    font-weight: 700;
    background: #3f51b5;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .effect-buttons button:hover {
    background: #5667d8;
  }
  #effectStatus {
    margin-top: 6px;
    font-size: 11px;
    color: #cdd0ff;
  }

  .tab-bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 0;
    background: #1a1a2a;
    padding: 6px;
    border-radius: 8px;
  }

  .tab-btn {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: #2a2a3d;
    color: #f5f5f5;
    font-size: 12px;
    cursor: pointer;
  }

  .tab-btn.active {
    background: #3f51b5;
    border-color: #5a6cff;
  }

  .right-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .tab-column {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }

  .tab-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .hidden {
    display: none !important;
  }

  .viewer-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
    flex: 1;
    min-height: 0;
  }

  #viewerPanel {
    width: 100%;
    height: 100%;
    flex: 1;
    align-self: flex-start;
  }

  .viewer-card {
    flex: 1;
    min-width: 0;
    background: #1f1f32;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }

  .viewer-card h2 {
    font-size: 14px;
    margin: 0;
    border-bottom: 1px solid #3a3a4f;
    padding-bottom: 6px;
  }

  .viewer-controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .viewer-controls input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #2a2a3d;
    color: #f5f5f5;
    font-size: 11px;
  }

  .viewer-controls label {
    margin: 0;
    font-size: 11px;
  }

  .viewer-controls button {
    padding: 4px 6px;
    font-size: 11px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background: #3f51b5;
    color: #fff;
  }

  .viewer-controls button.secondary {
    background: #5a5a6e;
  }

  .list-box {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: #0b0b0f;
    border-radius: 10px;
    padding: 10px;
  }

  .list-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 2px 4px;
    margin-bottom: 2px;
  }

  .list-item.new {
    background: rgba(255, 211, 64, 0.25);
    border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(255, 211, 64, 0.6);
    animation: blinkNew 1s steps(1, end) infinite;
  }

  .list-item.unread {
    background: #1a1a26;
    border-radius: 8px;
  }

  .chat-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    background: #2b2b3a;
    flex: 0 0 auto;
  }

  .chat-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .chat-content {
    flex: 1;
    min-width: 0;
  }

  .chat-header {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 1px;
  }

  .chat-time {
    color: #9a9a9a;
    font-size: 12px;
    min-width: 56px;
  }

  .item-author {
    font-weight: 700;
    font-size: 13px;
    color: #f5f5f5;
  }

  .item-author.member {
    color: #39d264;
  }

  .item-author.moderator {
    color: #4da3ff;
  }

  .item-text {
    font-size: 13px;
    word-break: break-word;
    color: #f5f5f5;
    line-height: 1.25;
  }

  .item-text img.emoji {
    height: 1.4em;
    vertical-align: middle;
  }

  .item-text img.sticker {
    height: 32px;
    vertical-align: middle;
  }

  .item-badge {
    padding: 2px 6px;
    border-radius: 10px;
    background: #2a2a44;
    color: #cfd3ff;
    font-size: 10px;
    white-space: nowrap;
  }
  .item-badge.first-time {
    background: #1f6f43;
    color: #e9ffef;
  }
  .item-badge.last-stream {
    background: #2b314a;
    color: #d8deff;
  }

  .participant-rank {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #2a2a44;
    color: #e7e9ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex: 0 0 auto;
  }

  .participant-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .participant-actions button {
    padding: 3px 6px;
    font-size: 11px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background: #3f51b5;
    color: #fff;
  }

  .participant-actions button.secondary {
    background: #5a5a6e;
  }

  .participant-actions button.danger {
    background: #b53f4b;
  }

  .list-item.done {
    opacity: 0.55;
  }

  .item-badge.participant-status {
    background: #51411d;
    color: #ffe7a3;
  }

  .item-badge.participant-status.done {
    background: #264b37;
    color: #d8ffe6;
  }

  @keyframes blinkNew {
    0%, 100% { background: rgba(255, 211, 64, 0.35); box-shadow: 0 0 0 1px rgba(255, 211, 64, 0.6); }
    50% { background: transparent; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="left-panel">
    <h1>YouTube Chat Overlay</h1>

    <label>
      チャンネルID / @ハンドル / 動画ID
      <input type="text" id="inputTarget" placeholder="@すずなゆい / UCxxxx / abcdefghijk" />
    </label>

    <div class="buttons">
      <button id="btnStart">チャット取得開始</button>
      <button id="btnStop">停止</button>
    </div>

    <div id="status">ステータス: 停止中</div>

    <div class="tab-column">
      <div id="launchersBox">
        <div id="launchersPath">OBS 用ランチャーフォルダ: 準備中…</div>
        <button id="btnOpenLaunchers">フォルダを開く（ドラッグ用）</button>
        <div class="small">
          フォルダ内の <code>*.html</code> を OBS にドラッグ＆ドロップ
        </div>
      </div>

      <div class="tab-bar" id="mainTabs">
        <button class="tab-btn active" data-tab="settings">設定</button>
        <button class="tab-btn" data-tab="viewer">コメント閲覧</button>
      </div>

      <div class="tab-bar" id="viewerTabs">
        <button class="tab-btn active" data-tab="comments">コメント</button>
        <button class="tab-btn" data-tab="participants">参加管理</button>
        <button class="tab-btn" data-tab="supers">スパチャ読み</button>
      </div>

      <div class="tab-bar" id="settingsTabs">
        <button class="tab-btn active" data-tab="overlay">通常</button>
        <button class="tab-btn" data-tab="nico">ニコニコ</button>
        <button class="tab-btn" data-tab="supers">Supers</button>
        <button class="tab-btn" data-tab="effects">エフェクト</button>
      </div>
    </div>

  </div>

  <div class="right-panel">
    <div class="tab-content">
      <div class="settings-row" id="settingsPanel">
      <!-- オーバーレイ設定 -->
      <div class="settings-col">
        <div class="color-settings">
          <h2>📺 通常オーバーレイ設定</h2>

          <div class="color-row">
            <label>フォント</label>
            <select id="fontFamily">
              <optgroup label="— Webフォント —">
                <option value="Noto Sans JP">Noto Sans JP</option>
                <option value="M PLUS Rounded 1c">M PLUS Rounded 1c</option>
                <option value="M PLUS 1p">M PLUS 1p</option>
                <option value="Kosugi Maru">小杉丸ゴシック</option>
                <option value="Zen Maru Gothic">Zen Maru Gothic</option>
                <option value="BIZ UDGothic">BIZ UDゴシック</option>
                <option value="Klee One">Klee One</option>
                <option value="Yusei Magic">Yusei Magic</option>
                <option value="Hachi Maru Pop">はちまるポップ</option>
              </optgroup>
              <optgroup label="— システムフォント —">
                <option value="Yu Gothic">游ゴシック</option>
                <option value="Meiryo">メイリオ</option>
                <option value="MS Gothic">MS ゴシック</option>
                <option value="Arial">Arial</option>
              </optgroup>
              <optgroup id="installedFontsGroup" label="— インストール済み —">
              </optgroup>
            </select>
          </div>
          <div class="color-row">
            <label>背景色</label>
            <input type="color" id="colorNormal" value="#000000" />
            <input type="range" id="alphaNormal" min="0" max="100" value="100" />
            <span class="alpha-value" id="alphaNormalVal">100%</span>
          </div>
          <div class="color-row">
            <label>文字色</label>
            <input type="color" id="colorText" value="#ffffff" />
            <input type="range" id="alphaText" min="0" max="100" value="100" />
            <span class="alpha-value" id="alphaTextVal">100%</span>
          </div>
          <div class="color-row">
            <label>投稿者名</label>
            <input type="color" id="colorAuthor" value="#ffd8f8" />
            <input type="range" id="alphaAuthor" min="0" max="100" value="100" />
            <span class="alpha-value" id="alphaAuthorVal">100%</span>
          </div>
          <div class="color-row">
            <label>サイズ (px)</label>
            <input type="number" id="fontSize" value="22" min="10" max="48" />
          </div>
          <div class="color-row">
            <label>アイコンサイズ (px)</label>
            <input type="number" id="avatarSize" value="40" min="16" max="120" />
          </div>
          <div class="color-row">
            <label>太字</label>
            <input type="checkbox" id="fontBold" checked />
          </div>
          <div class="color-row">
            <label>影</label>
            <input type="checkbox" id="shadowEnabled" checked />
            <input type="color" id="colorShadow" value="#000000" />
            <input type="range" id="alphaShadow" min="0" max="100" value="90" />
            <span class="alpha-value" id="alphaShadowVal">90%</span>
          </div>
          <div class="color-row">
            <label>メンバー背景</label>
            <input type="color" id="colorMembership" value="#1e7d32" />
            <input type="range" id="alphaMembership" min="0" max="100" value="100" />
            <span class="alpha-value" id="alphaMembershipVal">100%</span>
          </div>
          <button id="btnResetColors">デフォルトに戻す</button>
        </div>
      </div>

      <!-- ニコニコ風設定 -->
      <div class="settings-col">
        <div class="color-settings">
          <h2>🎬 ニコニコ風設定</h2>

          <div class="color-row">
            <label>フォント</label>
            <select id="nicoFontFamily">
              <optgroup label="— Webフォント —">
                <option value="Noto Sans JP">Noto Sans JP</option>
                <option value="M PLUS Rounded 1c">M PLUS Rounded 1c</option>
                <option value="M PLUS 1p">M PLUS 1p</option>
                <option value="Kosugi Maru">小杉丸ゴシック</option>
                <option value="Zen Maru Gothic">Zen Maru Gothic</option>
                <option value="BIZ UDGothic">BIZ UDゴシック</option>
                <option value="Klee One">Klee One</option>
                <option value="Yusei Magic">Yusei Magic</option>
                <option value="Hachi Maru Pop">はちまるポップ</option>
              </optgroup>
              <optgroup label="— システムフォント —">
                <option value="Yu Gothic">游ゴシック</option>
                <option value="Meiryo">メイリオ</option>
                <option value="MS Gothic">MS ゴシック</option>
                <option value="Arial">Arial</option>
                <option value="Impact">Impact</option>
              </optgroup>
              <optgroup id="nicoInstalledFontsGroup" label="— インストール済み —">
              </optgroup>
            </select>
          </div>
          <div class="color-row">
            <label>文字色</label>
            <input type="color" id="nicoColorText" value="#ffffff" />
            <input type="range" id="nicoAlphaText" min="0" max="100" value="100" />
            <span class="alpha-value" id="nicoAlphaTextVal">100%</span>
          </div>
          <div class="color-row">
            <label>サイズ (px)</label>
            <input type="number" id="nicoFontSize" value="64" min="20" max="200" />
          </div>
          <div class="color-row">
            <label>太字</label>
            <input type="checkbox" id="nicoFontBold" checked />
          </div>
          <div class="color-row">
            <label>流れる速度 (秒)</label>
            <input type="number" id="nicoScrollDuration" value="8" min="3" max="20" step="0.5" />
          </div>
          <div class="color-row">
            <label>縁取り</label>
            <input type="checkbox" id="nicoShadowEnabled" checked />
            <input type="color" id="nicoColorShadow" value="#000000" />
            <input type="range" id="nicoAlphaShadow" min="0" max="100" value="100" />
            <span class="alpha-value" id="nicoAlphaShadowVal">100%</span>
          </div>
          <button id="btnResetNico">デフォルトに戻す</button>
        </div>
      </div>

      <div class="settings-col">
        <div class="color-settings">
          <h2>💎 Supers オーバーレイ設定</h2>

          <div class="color-row">
            <label>フォント</label>
            <select id="supersFontFamily">
              <optgroup label="— Webフォント —">
                <option value="Noto Sans JP">Noto Sans JP</option>
                <option value="M PLUS Rounded 1c">M PLUS Rounded 1c</option>
                <option value="M PLUS 1p">M PLUS 1p</option>
                <option value="Kosugi Maru">小杉丸ゴシック</option>
                <option value="Zen Maru Gothic">Zen Maru Gothic</option>
                <option value="BIZ UDGothic">BIZ UDゴシック</option>
                <option value="Klee One">Klee One</option>
                <option value="Yusei Magic">Yusei Magic</option>
                <option value="Hachi Maru Pop">はちまるポップ</option>
              </optgroup>
              <optgroup label="— システムフォント —">
                <option value="Yu Gothic">游ゴシック</option>
                <option value="Meiryo">メイリオ</option>
                <option value="MS Gothic">MS ゴシック</option>
                <option value="Arial">Arial</option>
              </optgroup>
              <optgroup id="supersInstalledFontsGroup" label="— インストール済み —">
              </optgroup>
            </select>
          </div>
          <div class="color-row">
            <label>背景色</label>
            <input type="color" id="supersColorNormal" value="#000000" />
            <input type="range" id="supersAlphaNormal" min="0" max="100" value="100" />
            <span class="alpha-value" id="supersAlphaNormalVal">100%</span>
          </div>
          <div class="color-row">
            <label>文字色</label>
            <input type="color" id="supersColorText" value="#ffffff" />
            <input type="range" id="supersAlphaText" min="0" max="100" value="100" />
            <span class="alpha-value" id="supersAlphaTextVal">100%</span>
          </div>
          <div class="color-row">
            <label>投稿者名</label>
            <input type="color" id="supersColorAuthor" value="#ffd8f8" />
            <input type="range" id="supersAlphaAuthor" min="0" max="100" value="100" />
            <span class="alpha-value" id="supersAlphaAuthorVal">100%</span>
          </div>
          <div class="color-row">
            <label>サイズ (px)</label>
            <input type="number" id="supersFontSize" value="22" min="10" max="48" />
          </div>
          <div class="color-row">
            <label>アイコンサイズ (px)</label>
            <input type="number" id="supersAvatarSize" value="40" min="16" max="120" />
          </div>
          <div class="color-row">
            <label>太字</label>
            <input type="checkbox" id="supersFontBold" checked />
          </div>
          <div class="color-row">
            <label>影</label>
            <input type="checkbox" id="supersShadowEnabled" checked />
            <input type="color" id="supersColorShadow" value="#000000" />
            <input type="range" id="supersAlphaShadow" min="0" max="100" value="90" />
            <span class="alpha-value" id="supersAlphaShadowVal">90%</span>
          </div>
          <div class="color-row">
            <label>メンバー背景</label>

          <button id="btnParticipantCopy">待機者をコピー</button>

</div>

<script>
  const { ipcRenderer } = require("electron");

  const inputTarget = document.getElementById("inputTarget");
  const btnStart = document.getElementById("btnStart");
  const btnStop = document.getElementById("btnStop");
  const statusEl = document.getElementById("status");

  const launchersPathEl = document.getElementById("launchersPath");
  const btnOpenLaunchers = document.getElementById("btnOpenLaunchers");
  const effectStatus = document.getElementById("effectStatus");
  const KEY = "yt-overlay-input";
  const EFFECT_ENDPOINT = "http://127.0.0.1:5000/trigger-effect";
  const mainTabs = document.querySelectorAll("#mainTabs .tab-btn");
  const settingsTabs = document.querySelectorAll("#settingsTabs .tab-btn");
  const viewerTabs = document.querySelectorAll("#viewerTabs .tab-btn");
  const settingsTabsBar = document.getElementById("settingsTabs");
  const viewerTabsBar = document.getElementById("viewerTabs");
  const settingsPanel = document.getElementById("settingsPanel");
  const viewerPanel = document.getElementById("viewerPanel");
  const viewerCommentsCard = document.getElementById("viewerCommentsCard");
  const viewerSupersCard = document.getElementById("viewerSupersCard");
  const viewerParticipantsCard = document.getElementById("viewerParticipantsCard");
  const settingsCols = settingsPanel ? settingsPanel.querySelectorAll(".settings-col") : [];
  const overlayCol = settingsCols[0] || null;
  const nicoCol = settingsCols[1] || null;
  const supersCol = settingsCols[2] || null;
  const supersBox = supersCol ? supersCol.querySelector(".color-settings") : null;
  const effectsBox = supersCol ? supersCol.querySelector(".effect-box") : null;

  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      inputTarget.value = saved;
    }

    const mainTabSaved = localStorage.getItem("yt-overlay-main-tab") || "settings";
    const settingsTabSaved = localStorage.getItem("yt-overlay-settings-tab") || "overlay";
    const viewerTabSaved = localStorage.getItem("yt-overlay-viewer-tab") || "comments";

    function setActiveTab(buttons, target) {
      buttons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === target);
      });
    }

    function showMainTab(name) {
      if (name === "viewer") {
        if (viewerPanel) viewerPanel.classList.remove("hidden");
        if (settingsPanel) settingsPanel.classList.add("hidden");
        if (settingsTabsBar) settingsTabsBar.classList.add("hidden");
        if (viewerTabsBar) viewerTabsBar.classList.remove("hidden");
      } else {
        if (viewerPanel) viewerPanel.classList.add("hidden");
        if (settingsPanel) settingsPanel.classList.remove("hidden");
        if (settingsTabsBar) settingsTabsBar.classList.remove("hidden");
        if (viewerTabsBar) viewerTabsBar.classList.add("hidden");
      }
      setActiveTab(mainTabs, name);
      localStorage.setItem("yt-overlay-main-tab", name);
    }

    function showSettingsTab(name) {
      if (overlayCol) overlayCol.classList.toggle("hidden", name !== "overlay");
      if (nicoCol) nicoCol.classList.toggle("hidden", name !== "nico");
      if (supersCol) supersCol.classList.toggle("hidden", name !== "supers" && name !== "effects");
      if (supersBox) supersBox.classList.toggle("hidden", name !== "supers");
      if (effectsBox) effectsBox.classList.toggle("hidden", name !== "effects");
      setActiveTab(settingsTabs, name);
      localStorage.setItem("yt-overlay-settings-tab", name);
    }

    function showViewerTab(name) {
      if (viewerCommentsCard) viewerCommentsCard.classList.toggle("hidden", name !== "comments");
      if (viewerSupersCard) viewerSupersCard.classList.toggle("hidden", name !== "supers");
      if (viewerParticipantsCard) viewerParticipantsCard.classList.toggle("hidden", name !== "participants");
      setActiveTab(viewerTabs, name);
      localStorage.setItem("yt-overlay-viewer-tab", name);
    }


    mainTabs.forEach((btn) => {
      btn.addEventListener("click", () => showMainTab(btn.dataset.tab));
    });

    settingsTabs.forEach((btn) => {
      btn.addEventListener("click", () => showSettingsTab(btn.dataset.tab));
    });

    viewerTabs.forEach((btn) => {
      btn.addEventListener("click", () => showViewerTab(btn.dataset.tab));
    });


    showSettingsTab(settingsTabSaved);
    showViewerTab(viewerTabSaved);
    showMainTab(mainTabSaved);

  });

  btnStart.addEventListener("click", () => {
    const v = inputTarget.value.trim();
    if (!v) {
      statusEl.textContent = "ステータス: 入力が空です";
      return;
    }

    localStorage.setItem(KEY, v);

    statusEl.textContent = "ステータス: 起動中…";
    ipcRenderer.send("chat:start", v);
  });

  btnStop.addEventListener("click", () => {
    ipcRenderer.send("chat:stop");
    statusEl.textContent = "ステータス: 停止要求を送信しました…";
  });

  // メインプロセスからのステータス通知
  ipcRenderer.on("chat:status", (_event, state) => {
    if (state === "starting") {
      statusEl.textContent = "ステータス: 起動中…";
    } else if (state === "stopped") {
      statusEl.textContent = "ステータス: 停止中";
    } else {
      statusEl.textContent = "ステータス: " + state;
    }
  });

  ipcRenderer.on("chat:error", (_event, message) => {
    statusEl.textContent = "ステータス: エラー: " + message;
  });

  // ランチャーフォルダのパス表示
  ipcRenderer.on("launchers:path", (_event, dirPath) => {
    launchersPathEl.textContent = "OBS 用ランチャーフォルダ: " + dirPath;
  });

  btnOpenLaunchers.addEventListener("click", () => {
    ipcRenderer.send("launchers:open");
  });

  // エフェクト手動トリガー
  async function triggerEffect(type) {
    if (!type) return;
    const label = {
      firework: "花火",
      snow: "雪",
      heart: "ハート",
      star: "流れ星",
      explosion: "爆発",
      tikuwa: "ちくわ/鉄アレイ",
      sirakaba: "シラカバ"
    }[type] || type;
    effectStatus.textContent = `${label} を送信中…`;
    try {
      const res = await fetch(EFFECT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      effectStatus.textContent = `${label} を送信しました`;
    } catch (e) {
      effectStatus.textContent = `${label} の送信に失敗しました: ${e?.message || e}`;
    }
  }

  document.querySelectorAll("[data-effect]").forEach((btn) => {
    btn.addEventListener("click", () => triggerEffect(btn.dataset.effect));
  });

  // ========== インストール済みフォント検出 ==========
  async function detectInstalledFonts() {
    const installedGroup = document.getElementById("installedFontsGroup");
    const nicoInstalledGroup = document.getElementById("nicoInstalledFontsGroup");
    const supersInstalledGroup = document.getElementById("supersInstalledFontsGroup");
    
    // Local Font Access API が使える場合
    if ("queryLocalFonts" in window) {
      try {
        const fonts = await window.queryLocalFonts();
        const fontFamilies = new Set();
        for (const font of fonts) {
          fontFamilies.add(font.family);
        }
        
        // 日本語フォントを優先的に表示
        const jpFonts = [];
        const otherFonts = [];
        
        for (const family of fontFamilies) {
          // 既にリストにあるものは除外
          const existingOptions = document.querySelectorAll("#fontFamily option");
          let exists = false;
          for (const opt of existingOptions) {
            if (opt.value === family) {
              exists = true;
              break;
            }
          }
          if (exists) continue;
          
          // 日本語フォントっぽいものを判定
          if (/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]|Gothic|Mincho|Meiryo|Yu|Hiragino|Noto.*JP|Source Han|ゴシック|明朝/.test(family)) {
            jpFonts.push(family);
          } else {
            otherFonts.push(family);
          }
        }
        
        jpFonts.sort();
        otherFonts.sort();
        
        for (const family of [...jpFonts, ...otherFonts].slice(0, 50)) {
          const option1 = document.createElement("option");
          option1.value = family;
          option1.textContent = family;
          installedGroup.appendChild(option1);

          const option2 = document.createElement("option");
          option2.value = family;
          option2.textContent = family;
          nicoInstalledGroup.appendChild(option2);

          const option3 = document.createElement("option");
          option3.value = family;
          option3.textContent = family;
          supersInstalledGroup.appendChild(option3);
        }
      } catch (e) {
        console.log("Font detection not available:", e);
      }
    }
  }
  
  detectInstalledFonts();

  // ========== オーバーレイ設定 ==========
  const COLOR_KEY = "yt-overlay-colors";

  const defaultColors = {
    fontFamily: "Noto Sans JP",
    colorNormal: "#000000",
    alphaNormal: 100,
    colorText: "#ffffff",
    alphaText: 100,
    colorAuthor: "#ffd8f8",
    alphaAuthor: 100,
    fontSize: 22,
    avatarSize: 40,
    fontBold: true,
    shadowEnabled: true,
    colorShadow: "#000000",
    alphaShadow: 90,
    colorMembership: "#1e7d32",
    alphaMembership: 100
  };

  // ========== Supers 設定 ==========
  const SUPERS_KEY = "yt-overlay-supers";

  const defaultSupers = {
    fontFamily: "Noto Sans JP",
    colorNormal: "#000000",
    alphaNormal: 100,
    colorText: "#ffffff",
    alphaText: 100,
    colorAuthor: "#ffd8f8",
    alphaAuthor: 100,
    fontSize: 22,
    avatarSize: 40,
    fontBold: true,
    shadowEnabled: true,
    colorShadow: "#000000",
    alphaShadow: 90,
    colorMembership: "#1e7d32",
    alphaMembership: 100
  };

  const colorInputs = {
    fontFamily: document.getElementById("fontFamily"),
    colorNormal: document.getElementById("colorNormal"),
    alphaNormal: document.getElementById("alphaNormal"),
    colorText: document.getElementById("colorText"),
    alphaText: document.getElementById("alphaText"),
    colorAuthor: document.getElementById("colorAuthor"),
    alphaAuthor: document.getElementById("alphaAuthor"),
    fontSize: document.getElementById("fontSize"),
    avatarSize: document.getElementById("avatarSize"),
    fontBold: document.getElementById("fontBold"),
    shadowEnabled: document.getElementById("shadowEnabled"),
    colorShadow: document.getElementById("colorShadow"),
    alphaShadow: document.getElementById("alphaShadow"),
    colorMembership: document.getElementById("colorMembership"),
    alphaMembership: document.getElementById("alphaMembership")
  };

  const supersInputs = {
    fontFamily: document.getElementById("supersFontFamily"),
    colorNormal: document.getElementById("supersColorNormal"),
    alphaNormal: document.getElementById("supersAlphaNormal"),
    colorText: document.getElementById("supersColorText"),
    alphaText: document.getElementById("supersAlphaText"),
    colorAuthor: document.getElementById("supersColorAuthor"),
    alphaAuthor: document.getElementById("supersAlphaAuthor"),
    fontSize: document.getElementById("supersFontSize"),
    avatarSize: document.getElementById("supersAvatarSize"),
    fontBold: document.getElementById("supersFontBold"),
    shadowEnabled: document.getElementById("supersShadowEnabled"),
    colorShadow: document.getElementById("supersColorShadow"),
    alphaShadow: document.getElementById("supersAlphaShadow"),
    colorMembership: document.getElementById("supersColorMembership"),
    alphaMembership: document.getElementById("supersAlphaMembership")
  };

  // ========== ニコニコ風設定 ==========
  const NICO_KEY = "yt-overlay-nico";

  const defaultNico = {
    fontFamily: "Noto Sans JP",
    colorText: "#ffffff",
    alphaText: 100,
    fontSize: 64,
    fontBold: true,
    scrollDuration: 8,
    shadowEnabled: true,
    colorShadow: "#000000",
    alphaShadow: 100
  };

  const nicoInputs = {
    fontFamily: document.getElementById("nicoFontFamily"),
    colorText: document.getElementById("nicoColorText"),
    alphaText: document.getElementById("nicoAlphaText"),
    fontSize: document.getElementById("nicoFontSize"),
    fontBold: document.getElementById("nicoFontBold"),
    scrollDuration: document.getElementById("nicoScrollDuration"),
    shadowEnabled: document.getElementById("nicoShadowEnabled"),
    colorShadow: document.getElementById("nicoColorShadow"),
    alphaShadow: document.getElementById("nicoAlphaShadow")
  };

  function updateAlphaDisplay() {
    // オーバーレイ用
    const alphaKeys = ["alphaNormal", "alphaText", "alphaAuthor", "alphaShadow", "alphaMembership"];
    for (const key of alphaKeys) {
      const valEl = document.getElementById(key + "Val");
      if (valEl && colorInputs[key]) {
        valEl.textContent = colorInputs[key].value + "%";
      }
    }
    // Supers用
    const supersAlphaKeys = ["alphaNormal", "alphaText", "alphaAuthor", "alphaShadow", "alphaMembership"];
    for (const key of supersAlphaKeys) {
      const valEl = document.getElementById("supers" + key.charAt(0).toUpperCase() + key.slice(1) + "Val");
      if (valEl && supersInputs[key]) {
        valEl.textContent = supersInputs[key].value + "%";
      }
    }
    // ニコニコ用
    const nicoAlphaKeys = ["alphaText", "alphaShadow"];
    for (const key of nicoAlphaKeys) {
      const valEl = document.getElementById("nico" + key.charAt(0).toUpperCase() + key.slice(1) + "Val");
      if (valEl && nicoInputs[key]) {
        valEl.textContent = nicoInputs[key].value + "%";
      }
    }
  }

  function loadColorSettings() {
    const saved = localStorage.getItem(COLOR_KEY);
    const colors = saved ? JSON.parse(saved) : defaultColors;
    for (const key in colorInputs) {
      if (colorInputs[key].type === "checkbox") {
        colorInputs[key].checked = colors[key] ?? defaultColors[key];
      } else {
        colorInputs[key].value = colors[key] ?? defaultColors[key];
      }
    }
  }

  function loadSupersSettings() {
    const saved = localStorage.getItem(SUPERS_KEY);
    const supers = saved ? JSON.parse(saved) : defaultSupers;
    for (const key in supersInputs) {
      if (supersInputs[key].type === "checkbox") {
        supersInputs[key].checked = supers[key] ?? defaultSupers[key];
      } else {
        supersInputs[key].value = supers[key] ?? defaultSupers[key];
      }
    }
  }

  function loadNicoSettings() {
    const saved = localStorage.getItem(NICO_KEY);
    const nico = saved ? JSON.parse(saved) : defaultNico;
    for (const key in nicoInputs) {
      if (nicoInputs[key].type === "checkbox") {
        nicoInputs[key].checked = nico[key] ?? defaultNico[key];
      } else {
        nicoInputs[key].value = nico[key] ?? defaultNico[key];
      }
    }
  }

  function saveColorSettings() {
    const colors = {};
    for (const key in colorInputs) {
      if (colorInputs[key].type === "checkbox") {
        colors[key] = colorInputs[key].checked;
      } else {
        colors[key] = colorInputs[key].value;
      }
    }
    localStorage.setItem(COLOR_KEY, JSON.stringify(colors));
    updateAlphaDisplay();
    sendAllSettings();
  }

  function saveSupersSettings() {
    const supers = {};
    for (const key in supersInputs) {
      if (supersInputs[key].type === "checkbox") {
        supers[key] = supersInputs[key].checked;
      } else {
        supers[key] = supersInputs[key].value;
      }
    }
    localStorage.setItem(SUPERS_KEY, JSON.stringify(supers));
    updateAlphaDisplay();
    sendAllSettings();
  }

  function saveNicoSettings() {
    const nico = {};
    for (const key in nicoInputs) {
      if (nicoInputs[key].type === "checkbox") {
        nico[key] = nicoInputs[key].checked;
      } else {
        nico[key] = nicoInputs[key].value;
      }
    }
    localStorage.setItem(NICO_KEY, JSON.stringify(nico));
    updateAlphaDisplay();
    sendAllSettings();
  }

  function sendAllSettings() {
    const colorsSaved = localStorage.getItem(COLOR_KEY);
    const supersSaved = localStorage.getItem(SUPERS_KEY);
    const nicoSaved = localStorage.getItem(NICO_KEY);
    const colors = colorsSaved ? JSON.parse(colorsSaved) : defaultColors;
    const supers = supersSaved ? JSON.parse(supersSaved) : defaultSupers;
    const nico = nicoSaved ? JSON.parse(nicoSaved) : defaultNico;
    ipcRenderer.send("colors:update", { overlay: colors, supers: supers, nico: nico });
  }

  // 各入力の変更を監視
  for (const key in colorInputs) {
    colorInputs[key].addEventListener("input", saveColorSettings);
    colorInputs[key].addEventListener("change", saveColorSettings);
  }
  for (const key in supersInputs) {
    supersInputs[key].addEventListener("input", saveSupersSettings);
    supersInputs[key].addEventListener("change", saveSupersSettings);
  }
  for (const key in nicoInputs) {
    nicoInputs[key].addEventListener("input", saveNicoSettings);
    nicoInputs[key].addEventListener("change", saveNicoSettings);
  }


  document.getElementById("btnResetColors").addEventListener("click", () => {
    for (const key in colorInputs) {
      if (colorInputs[key].type === "checkbox") {
        colorInputs[key].checked = defaultColors[key];
      } else {
        colorInputs[key].value = defaultColors[key];
      }
    }
    saveColorSettings();
  });

  document.getElementById("btnResetSupers").addEventListener("click", () => {
    for (const key in supersInputs) {
      if (supersInputs[key].type === "checkbox") {
        supersInputs[key].checked = defaultSupers[key];
      } else {
        supersInputs[key].value = defaultSupers[key];
      }
    }
    saveSupersSettings();
  });

  document.getElementById("btnResetNico").addEventListener("click", () => {
    for (const key in nicoInputs) {
      if (nicoInputs[key].type === "checkbox") {
        nicoInputs[key].checked = defaultNico[key];
      } else {
        nicoInputs[key].value = defaultNico[key];
      }
    }
    saveNicoSettings();
  });

  // 初期読み込み
  loadColorSettings();
  loadSupersSettings();
  loadNicoSettings();
  updateAlphaDisplay();
  // 起動時に現在の設定をサーバーに送信
  setTimeout(() => {
    sendAllSettings();
  }, 500);

  // ========== コメントビュー / スパチャ読み ==========
  const COMMENTS_ENDPOINT = "http://127.0.0.1:5000/comments";
  const PARTICIPANT_ENDPOINT = "http://127.0.0.1:5000/api/participants";
  const SUPER_READ_KEY = "yt-overlay-super-read";
  const PARTICIPANT_KEY = "yt-overlay-participants";
  const PARTICIPANT_KEYWORD = "参加希望";

  const commentFilter = document.getElementById("commentFilter");
  const commentPause = document.getElementById("commentPause");
  const commentList = document.getElementById("commentList");
  const superList = document.getElementById("superList");
  const superUnreadOnly = document.getElementById("superUnreadOnly");
  const btnSuperMarkAll = document.getElementById("btnSuperMarkAll");
  const btnSuperCopy = document.getElementById("btnSuperCopy");
  const superCount = document.getElementById("superCount");
  const participantList = document.getElementById("participantList");
  const participantHideDone = document.getElementById("participantHideDone");
  const btnParticipantCopy = document.getElementById("btnParticipantCopy");
  const btnParticipantClearDone = document.getElementById("btnParticipantClearDone");
  const btnParticipantClearAll = document.getElementById("btnParticipantClearAll");
  const participantCount = document.getElementById("participantCount");

  const commentStore = new Map();
  const highlightStartById = new Map();
  let initialLoaded = false;
  let lastAfterMs = 0;
  let currentVideoId = null;
  let superReadMap = {};
  let participantMap = {};

  const superKinds = new Set([
    "paid",
    "sticker",
    "membership",
    "gift_purchase",
    "gift_redeem",
  ]);

  function currentReadKey() {
    return currentVideoId || "default";
  }

  function currentParticipantKey() {
    return currentVideoId || "default";
  }

  function loadReadMap() {
    try {
      const raw = localStorage.getItem(SUPER_READ_KEY);
      superReadMap = raw ? JSON.parse(raw) : {};
    } catch (_) {
      superReadMap = {};
    }
    const key = currentReadKey();
    if (!superReadMap[key]) superReadMap[key] = {};
  }

  function saveReadMap() {
    localStorage.setItem(SUPER_READ_KEY, JSON.stringify(superReadMap));
  }

  function setRead(id, value) {
    const key = currentReadKey();
    if (!superReadMap[key]) superReadMap[key] = {};
    if (value) {
      superReadMap[key][id] = true;
    } else {
      delete superReadMap[key][id];
    }
    saveReadMap();
  }

  function isRead(id) {
    const key = currentReadKey();
    return !!(superReadMap[key] && superReadMap[key][id]);
  }

  async function refreshParticipantMapFromServer() {
    const params = new URLSearchParams();
    if (currentVideoId) params.set("videoId", currentVideoId);
    const res = await fetch(`${PARTICIPANT_ENDPOINT}?${params.toString()}`);
    if (!res.ok) return false;
    const data = await res.json();
    if (!data || !Array.isArray(data.items)) return false;
    if (data.videoId) currentVideoId = data.videoId;
    const key = currentParticipantKey();
    participantMap[key] = {};
    for (const item of data.items) {
      if (!item || !item.author_key) continue;
      participantMap[key][item.author_key] = item;
    }
    saveParticipantMap();
    return true;
  }

  async function loadParticipantMap() {
    try {
      const raw = localStorage.getItem(PARTICIPANT_KEY);
      participantMap = raw ? JSON.parse(raw) : {};
    } catch (_) {
      participantMap = {};
    }
    const key = currentParticipantKey();
    if (!participantMap[key]) participantMap[key] = {};
    try {
      await refreshParticipantMapFromServer();
    } catch (_) {}
  }

  function saveParticipantMap() {
    localStorage.setItem(PARTICIPANT_KEY, JSON.stringify(participantMap));
  }

  function participantAuthorKey(msg) {
    return (msg.author || "").trim() || `anonymous:${buildId(msg)}`;
  }

  function participantsForCurrentVideo() {
    const key = currentParticipantKey();
    if (!participantMap[key]) participantMap[key] = {};
    return participantMap[key];
  }

  function participantItems() {
    return Object.values(participantsForCurrentVideo()).sort(
      (a, b) => (a.accepted_ms || 0) - (b.accepted_ms || 0)
    );
  }

  function upsertParticipant(msg) {
    if (!msg || msg.kind !== "text") return false;
    const body = textFromMsg(msg);
    if (!body.includes(PARTICIPANT_KEYWORD)) return false;
    const authorKey = participantAuthorKey(msg);
    const current = participantsForCurrentVideo();
    if (current[authorKey]) return false;
    current[authorKey] = {
      id: buildId(msg),
      author_key: authorKey,
      author: msg.author || "(no name)",
      icon: msg.icon || "",
      text: body,
      accepted_ms: Number(msg.timestamp_ms) || Date.now(),
      status: "waiting",
    };
    saveParticipantMap();
    return true;
  }

  async function setParticipantStatus(authorKey, status) {
    const current = participantsForCurrentVideo();
    if (current[authorKey]) {
      current[authorKey].status = status;
      current[authorKey].updated_ms = Date.now();
      saveParticipantMap();
    }
    await fetch(`${PARTICIPANT_ENDPOINT}/status`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        videoId: currentParticipantKey(),
        authorKey,
        status,
      }),
    });
  }

  async function deleteParticipant(authorKey) {
    const current = participantsForCurrentVideo();
    delete current[authorKey];
    saveParticipantMap();
    await fetch(`${PARTICIPANT_ENDPOINT}/delete`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        videoId: currentParticipantKey(),
        authorKey,
      }),
    });
  }

  function findLatestVideoId(data) {
    let latest = null;
    for (const msg of data) {
      if (!msg || !msg.video_id) continue;
      const ts = Number.isFinite(msg.timestamp_ms) ? msg.timestamp_ms : 0;
      if (!latest || ts > latest.ts) {
        latest = { id: msg.video_id, ts };
      }
    }
    return latest ? latest.id : null;
  }

  function buildId(msg) {
    return (
      msg.id ||
      `${msg.timestamp_ms || 0}_${msg.author || ""}_${msg.text || ""}`
    );
  }

  function formatTime(ms) {
    if (!Number.isFinite(ms)) return "";
    const d = new Date(ms);
    const h = String(d.getHours()).padStart(2, "0");
    const m = String(d.getMinutes()).padStart(2, "0");
    const s = String(d.getSeconds()).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  function formatDateMd(ms) {
    if (!Number.isFinite(ms)) return "";
    const d = new Date(ms);
    const mo = String(d.getMonth() + 1).padStart(2, "0");
    const da = String(d.getDate()).padStart(2, "0");
    return `${mo}/${da}`;
  }

  function kindLabel(kind) {
    switch (kind) {
      case "paid":
        return "スパチャ";
      case "sticker":
        return "スパチャ(スタンプ)";
      case "membership":
        return "メンバー";
      case "gift_purchase":
        return "メンギフ購入";
      case "gift_redeem":
        return "メンギフ配布";
      default:
        return kind || "コメント";
    }
  }

  function amountLabel(msg) {
    if (msg.amount_text) return msg.amount_text;
    if (Number.isFinite(msg.amount)) return "¥" + msg.amount;
    return "";
  }

  function textFromMsg(msg) {
    if (Array.isArray(msg.parts)) {
      return msg.parts
        .map((part) => {
          if (part.type === "text") return part.text || "";
          if (part.type === "emoji") return part.alt || "";
          if (part.type === "sticker") return "[sticker]";
          return "";
        })
        .join("");
    }
    return msg.text || "";
  }

  function renderParts(container, msg) {
    container.textContent = "";
    if (Array.isArray(msg.parts)) {
      for (const part of msg.parts) {
        if (part.type === "text") {
          container.append(document.createTextNode(part.text || ""));
        } else if (part.type === "emoji") {
          const img = document.createElement("img");
          img.className = "emoji";
          img.src = part.url;
          img.alt = part.alt || "";
          container.append(img);
        } else if (part.type === "sticker") {
          const img = document.createElement("img");
          img.className = "sticker";
          img.src = part.url;
          img.alt = part.alt || "";
          container.append(img);
        }
      }
      return;
    }
    container.textContent = msg.text || "";
  }

  function hexToRgba(hex, alpha) {
    if (!hex || typeof hex !== "string") return "";
    const raw = hex.replace("#", "");
    if (raw.length !== 6) return "";
    const r = parseInt(raw.slice(0, 2), 16);
    const g = parseInt(raw.slice(2, 4), 16);
    const b = parseInt(raw.slice(4, 6), 16);
    const a = Number.isFinite(alpha) ? alpha / 100 : 1;
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  function getMembershipBg() {
    const color =
      (colorInputs.colorMembership && colorInputs.colorMembership.value) ||
      defaultColors.colorMembership;
    const alphaRaw =
      (colorInputs.alphaMembership && Number(colorInputs.alphaMembership.value)) ??
      defaultColors.alphaMembership;
    const alpha = Number.isFinite(alphaRaw) ? alphaRaw : 100;
    return hexToRgba(color, alpha);
  }

  function applyMembershipStyle(item) {
    const bg = getMembershipBg();
    if (bg) {
      item.style.background = bg;
      item.style.boxShadow = "0 0 0 1px " + bg;
    }
  }

  function trimStore() {
    if (commentStore.size <= 500) return;
    const items = Array.from(commentStore.values()).sort(
      (a, b) => (a.timestamp_ms || 0) - (b.timestamp_ms || 0)
    );
    const keep = items.slice(-500);
    commentStore.clear();
    for (const msg of keep) {
      commentStore.set(buildId(msg), msg);
    }
  }

  function renderComments() {
    if (commentPause.checked) return;
    const filter = commentFilter.value.trim().toLowerCase();
    const items = Array.from(commentStore.values())
      .filter((msg) => {
        if (!filter) return true;
        const author = (msg.author || "").toLowerCase();
        const text = textFromMsg(msg).toLowerCase();
        return author.includes(filter) || text.includes(filter);
      })
      .sort((a, b) => (a.timestamp_ms || 0) - (b.timestamp_ms || 0));

    const shouldStick =
      commentList.scrollTop + commentList.clientHeight >=
      commentList.scrollHeight - 24;
    commentList.innerHTML = "";
    for (const msg of items) {
      const item = document.createElement("div");
      item.className = "list-item";
      const id = buildId(msg);
      const now = Date.now();
      const startAt = highlightStartById.get(id);
      if (startAt && now - startAt <= 10000) {
        item.classList.add("new");
        item.style.animationDelay = `-${Math.min(9.9, (now - startAt) / 1000).toFixed(2)}s`;
      } else if (startAt) {
        highlightStartById.delete(id);
      }

      if (msg && (msg.kind === "paid" || msg.kind === "sticker") && msg.colors) {
        if (msg.colors.body_bg) {
          item.style.background = msg.colors.body_bg;
          item.style.boxShadow = "0 0 0 1px " + msg.colors.body_bg;
        }
      } else if (msg && (msg.kind === "membership" || msg.kind === "gift_purchase" || msg.kind === "gift_redeem")) {
        applyMembershipStyle(item);
      }

      const avatar = document.createElement("div");
      avatar.className = "chat-avatar";
      if (msg.icon) {
        const img = document.createElement("img");
        img.src = msg.icon;
        img.alt = msg.author || "";
        avatar.appendChild(img);
      }

      const content = document.createElement("div");
      content.className = "chat-content";

      const header = document.createElement("div");
      header.className = "chat-header";
      const time = document.createElement("span");
      time.className = "chat-time";
      time.textContent = formatTime(msg.timestamp_ms);
      const author = document.createElement("span");
      author.className = "item-author";
      if (msg.is_member || msg.kind === "membership") {
        author.classList.add("member");
      }
      if (msg.is_moderator) {
        author.classList.add("moderator");
      }
      author.textContent = msg.author || "(no name)";
      header.append(time, author);
      if (msg.is_first_time) {
        const first = document.createElement("span");
        first.className = "item-badge first-time";
        first.textContent = "初見";
        header.appendChild(first);
      } else if (msg.last_stream_first_ts && Number.isFinite(msg.last_stream_ago)) {
        const last = document.createElement("span");
        last.className = "item-badge last-stream";
        const date = formatDateMd(msg.last_stream_first_ts);
        last.textContent = `前回 ${date} (${msg.last_stream_ago}回前)`;
        header.appendChild(last);
      }

      const text = document.createElement("div");
      text.className = "item-text";
      renderParts(text, msg);

      if (msg && (msg.kind === "paid" || msg.kind === "sticker") && msg.colors && msg.colors.body_text) {
        author.style.color = msg.colors.body_text;
        text.style.color = msg.colors.body_text;
      }

      content.append(header, text);
      item.append(avatar, content);
      commentList.appendChild(item);
    }
    if (shouldStick) {
      commentList.scrollTop = commentList.scrollHeight;
    }
  }

  function renderSupers() {
    const unreadOnly = superUnreadOnly.checked;
    const items = Array.from(commentStore.values())
      .filter((msg) => superKinds.has(msg.kind))
      .sort((a, b) => (a.timestamp_ms || 0) - (b.timestamp_ms || 0));

    const shouldStick =
      superList.scrollTop + superList.clientHeight >=
      superList.scrollHeight - 24;
    let unreadCount = 0;
    superList.innerHTML = "";
    for (const msg of items) {
      const id = buildId(msg);
      const read = isRead(id);
      if (!read) unreadCount += 1;
      if (unreadOnly && read) continue;

      const item = document.createElement("div");
      item.className = "list-item" + (read ? "" : " unread");
      item.dataset.id = id;
      const now = Date.now();
      const startAt = highlightStartById.get(id);
      if (startAt && now - startAt <= 10000) {
        item.classList.add("new");
        item.style.animationDelay = `-${Math.min(9.9, (now - startAt) / 1000).toFixed(2)}s`;
      } else if (startAt) {
        highlightStartById.delete(id);
      }

      if (msg && (msg.kind === "paid" || msg.kind === "sticker") && msg.colors) {
        if (msg.colors.body_bg) {
          item.style.background = msg.colors.body_bg;
          item.style.boxShadow = "0 0 0 1px " + msg.colors.body_bg;
        }
      } else if (msg && (msg.kind === "membership" || msg.kind === "gift_purchase" || msg.kind === "gift_redeem")) {
        applyMembershipStyle(item);
      }

      const avatar = document.createElement("div");
      avatar.className = "chat-avatar";
      if (msg.icon) {
        const img = document.createElement("img");
        img.src = msg.icon;
        img.alt = msg.author || "";
        avatar.appendChild(img);
      }

      const content = document.createElement("div");
      content.className = "chat-content";

      const header = document.createElement("div");
      header.className = "chat-header";
      const time = document.createElement("span");
      time.className = "chat-time";
      time.textContent = formatTime(msg.timestamp_ms);
      const author = document.createElement("span");
      author.className = "item-author";
      if (msg.is_member || msg.kind === "membership") {
        author.classList.add("member");
      }
      if (msg.is_moderator) {
        author.classList.add("moderator");
      }
      author.textContent = msg.author || "(no name)";
      header.append(time, author);

      const amountText = amountLabel(msg);
      if (amountText) {
        const amount = document.createElement("span");
        amount.className = "item-badge";
        amount.textContent = amountText;
        header.appendChild(amount);
      } else {
        const kind = document.createElement("span");
        kind.className = "item-badge";
        kind.textContent = kindLabel(msg.kind);
        header.appendChild(kind);
      }

      const text = document.createElement("div");
      text.className = "item-text";
      renderParts(text, msg);

      if (msg && (msg.kind === "paid" || msg.kind === "sticker") && msg.colors && msg.colors.body_text) {
        author.style.color = msg.colors.body_text;
        text.style.color = msg.colors.body_text;
      }

      content.append(header, text);
      item.append(avatar, content);
      item.addEventListener("click", () => {
        const next = !isRead(id);
        setRead(id, next);
        renderSupers();
      });

      superList.appendChild(item);
    }
    if (shouldStick) {
      superList.scrollTop = superList.scrollHeight;
    }

    superCount.textContent = `未読: ${unreadCount}`;
  }

  async function renderParticipants() {
    try {
      await refreshParticipantMapFromServer();
    } catch (_) {}
    const hideDone = participantHideDone.checked;
    const items = participantItems();
    const waitingItems = items.filter((item) => item.status !== "done");
    const visibleItems = hideDone ? waitingItems : items;

    participantList.innerHTML = "";
    visibleItems.forEach((entry) => {
      const rank = waitingItems.findIndex((item) => item.author_key === entry.author_key) + 1;
      const item = document.createElement("div");
      item.className = "list-item" + (entry.status === "done" ? " done" : " unread");

      const num = document.createElement("div");
      num.className = "participant-rank";
      num.textContent = entry.status === "done" ? "-" : String(rank);

      const avatar = document.createElement("div");
      avatar.className = "chat-avatar";
      if (entry.icon) {
        const img = document.createElement("img");
        img.src = entry.icon;
        img.alt = entry.author || "";
        avatar.appendChild(img);
      }

      const content = document.createElement("div");
      content.className = "chat-content";

      const header = document.createElement("div");
      header.className = "chat-header";
      const time = document.createElement("span");
      time.className = "chat-time";
      time.textContent = formatTime(entry.accepted_ms);
      const author = document.createElement("span");
      author.className = "item-author";
      author.textContent = entry.author || "(no name)";
      const status = document.createElement("span");
      status.className = "item-badge participant-status" + (entry.status === "done" ? " done" : "");
      status.textContent = entry.status === "done" ? "完了" : "待機";
      header.append(time, author, status);

      const text = document.createElement("div");
      text.className = "item-text";
      text.textContent = entry.text || PARTICIPANT_KEYWORD;

      const actions = document.createElement("div");
      actions.className = "participant-actions";
      const doneBtn = document.createElement("button");
      doneBtn.textContent = entry.status === "done" ? "待機に戻す" : "完了";
      doneBtn.className = entry.status === "done" ? "secondary" : "";
      doneBtn.addEventListener("click", async () => {
        await setParticipantStatus(entry.author_key, entry.status === "done" ? "waiting" : "done");
        await renderParticipants();
      });
      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "削除";
      deleteBtn.className = "danger";
      deleteBtn.addEventListener("click", async () => {
        await deleteParticipant(entry.author_key);
        await renderParticipants();
      });
      actions.append(doneBtn, deleteBtn);

      content.append(header, text, actions);
      item.append(num, avatar, content);
      participantList.appendChild(item);
    });

    participantCount.textContent = `待機: ${waitingItems.length} / 合計: ${items.length}`;
  }

  async function fetchCommentsOnce(forceFull = false) {
    const params = new URLSearchParams();
    params.set("limit", "200");
    if (!forceFull && lastAfterMs > 0) {
      params.set("after", String(lastAfterMs));
    }
    try {
      const res = await fetch(`${COMMENTS_ENDPOINT}?${params.toString()}`);
      if (!res.ok) return;
      const data = await res.json();
      if (!Array.isArray(data)) return;

      const latestVideoId = findLatestVideoId(data);
      if (latestVideoId && latestVideoId !== currentVideoId) {
        currentVideoId = latestVideoId;
        commentStore.clear();
        highlightStartById.clear();
        initialLoaded = false;
        lastAfterMs = 0;
        loadReadMap();
        await loadParticipantMap();
        await fetchCommentsOnce(true);
        return;
      }

      let maxTs = lastAfterMs;
      for (const msg of data) {
        if (currentVideoId && msg.video_id && msg.video_id !== currentVideoId) {
          continue;
        }
        const id = buildId(msg);
        if (!commentStore.has(id)) {
          commentStore.set(id, msg);
          upsertParticipant(msg);
          if (initialLoaded) {
            highlightStartById.set(id, Date.now());
          }
        }
        const ts = Number.isFinite(msg.timestamp_ms) ? msg.timestamp_ms : 0;
        if (ts > maxTs) maxTs = ts;
      }
      if (!initialLoaded) {
        initialLoaded = true;
      }
      lastAfterMs = maxTs;
      trimStore();
      renderComments();
      renderSupers();
      renderParticipants();
    } catch (e) {
      console.error("fetchCommentsOnce error", e);
    }
  }

  commentFilter.addEventListener("input", renderComments);
  commentPause.addEventListener("change", renderComments);
  superUnreadOnly.addEventListener("change", renderSupers);
  participantHideDone.addEventListener("change", renderParticipants);
  btnSuperMarkAll.addEventListener("click", () => {
    const key = currentReadKey();
    if (!superReadMap[key]) superReadMap[key] = {};
    for (const msg of commentStore.values()) {
      if (!superKinds.has(msg.kind)) continue;
      superReadMap[key][buildId(msg)] = true;
    }
    saveReadMap();
    renderSupers();
  });
  btnSuperCopy.addEventListener("click", async () => {
    const items = Array.from(commentStore.values())
      .filter((msg) => superKinds.has(msg.kind))
      .filter((msg) => !isRead(buildId(msg)))
      .sort((a, b) => (a.timestamp_ms || 0) - (b.timestamp_ms || 0));
    const lines = items.map((msg) => {
      const time = formatTime(msg.timestamp_ms);
      const kind = kindLabel(msg.kind);
      const amount = amountLabel(msg);
      const author = msg.author || "(no name)";
      const text = textFromMsg(msg);
      return [time, kind, amount, author, text].filter(Boolean).join(" | ");
    });
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      superCount.textContent = `未読: ${lines.length} (コピー済み)`;
    } catch (e) {
      console.error("copy failed", e);
    }
  });
  btnParticipantCopy.addEventListener("click", async () => {
    try {
      await refreshParticipantMapFromServer();
    } catch (_) {}
    const lines = participantItems()
      .filter((item) => item.status !== "done")
      .map((item, idx) => `${idx + 1}. ${item.author}`);
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      participantCount.textContent = `待機: ${lines.length} (コピー済み)`;
    } catch (e) {
      console.error("copy failed", e);
    }
  });
  btnParticipantClearDone.addEventListener("click", async () => {
    const current = participantsForCurrentVideo();
    for (const item of Object.values(current)) {
      if (item.status === "done") delete current[item.author_key];
    }
    saveParticipantMap();
    await fetch(`${PARTICIPANT_ENDPOINT}/clear`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ videoId: currentParticipantKey(), mode: "done" }),
    });
    await renderParticipants();
  });
  btnParticipantClearAll.addEventListener("click", async () => {
    participantMap[currentParticipantKey()] = {};
    saveParticipantMap();
    await fetch(`${PARTICIPANT_ENDPOINT}/clear`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ videoId: currentParticipantKey(), mode: "all" }),
    });
    await renderParticipants();
  });

  loadReadMap();
  loadParticipantMap();
  setInterval(fetchCommentsOnce, 1000);
  fetchCommentsOnce(true);
</script>
</body>
</html>
