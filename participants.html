<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Participants Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel-bg: rgba(10, 12, 18, 0.72);
    --row-bg: rgba(255, 255, 255, 0.1);
    --accent: #ffd34d;
    --text: #ffffff;
    --muted: #d7d9e8;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text);
  }

  #wrap {
    position: absolute;
    inset: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }

  #panel {
    width: min(420px, 100%);
    max-height: 100%;
    padding: 12px;
    border-radius: 8px;
    background: var(--panel-bg);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    box-sizing: border-box;
    overflow: hidden;
  }

  #title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
    font-weight: 700;
    font-size: 22px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }

  #count {
    color: var(--accent);
    font-size: 18px;
  }

  #list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 42px;
    padding: 7px 9px;
    border-radius: 8px;
    background: var(--row-bg);
    box-sizing: border-box;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.14);
    flex: 0 0 auto;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    font-size: 18px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
  }

  #empty {
    padding: 16px 8px 8px;
    color: var(--muted);
    font-size: 16px;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }

  body.layout-horizontal #wrap {
    justify-content: center;
  }

  body.layout-horizontal #panel {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  body.layout-horizontal #title {
    flex: 0 0 auto;
    margin-bottom: 0;
    white-space: nowrap;
  }

  body.layout-horizontal #list {
    flex: 1 1 auto;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }

  body.layout-horizontal #empty {
    flex: 1 1 auto;
    padding: 8px;
  }

  body.layout-horizontal .row {
    flex: 0 1 auto;
    max-width: 280px;
  }

  body.layout-horizontal .name {
    max-width: 190px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <div id="title">
      <span>参加待機</span>
      <span id="count">0</span>
    </div>
    <div id="list"></div>
    <div id="empty">参加希望を受付中</div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const layoutOverride = params.get("layout");
  let horizontal = layoutOverride === "horizontal";
  const requestedLimit = Number.parseInt(params.get("limit"), 10);
  document.body.classList.toggle("layout-horizontal", horizontal);

  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");

  function normalizeItems(items) {
    const itemLimit = Number.isFinite(requestedLimit)
      ? Math.min(Math.max(requestedLimit, 1), 100)
      : (horizontal ? 20 : 10);
    return (Array.isArray(items) ? items : [])
      .filter((item) => item && item.status !== "done")
      .sort((a, b) => (a.accepted_ms || 0) - (b.accepted_ms || 0))
      .slice(0, itemLimit);
  }

  function render(items) {
    list.textContent = "";
    const waiting = normalizeItems(items);
    count.textContent = String(waiting.length);
    empty.style.display = waiting.length ? "none" : "block";

    waiting.forEach((item) => {
      const row = document.createElement("div");
      row.className = "row";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      if (item.icon) {
        const img = document.createElement("img");
        img.src = item.icon;
        img.alt = item.author || "";
        avatar.appendChild(img);
      }

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = item.author || "(no name)";

      row.append(avatar, name);
      list.appendChild(row);
    });
  }

  async function refresh() {
    try {
      const res = await fetch("/api/participants");
      if (!res.ok) return;
      const data = await res.json();
      render(data.items || []);
    } catch (e) {
      console.error("participants refresh error", e);
    }
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
