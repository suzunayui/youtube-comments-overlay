<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日英字幕</title>
<style>html{color-scheme:dark}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#captions{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;box-sizing:border-box;padding:20px 32px;background:#000;border-radius:20px;box-shadow:0 4px 20px #0005;text-align:center;font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700;line-height:1.4;overflow-wrap:anywhere}p{margin:0;text-shadow:none;-webkit-text-stroke:0}#ja{font-size:46px;color:white}#en{font-size:32px;color:#fff;margin-top:8px}#en:empty{display:none}</style>
<div id="captions" hidden><p id="ja"></p><p id="en"></p></div>
<script>
const box=document.getElementById('captions'), ja=document.getElementById('ja'), en=document.getElementById('en'); let timer;
const events=new EventSource('/subtitle-events');
events.onmessage=event=>{const state=JSON.parse(event.data),style=state.style;clearTimeout(timer);ja.style.fontSize=style.fontSize+'px';en.style.fontSize=style.englishSize+'px';ja.style.color=style.color;en.style.color=style.englishColor;
const subtitle=state.subtitle,remaining=subtitle?style.duration*1000-(Date.now()-subtitle.receivedAt):0;
box.hidden=!subtitle||remaining<=0;if(box.hidden)return;ja.textContent=subtitle.ja;en.textContent=subtitle.en;timer=setTimeout(()=>box.hidden=true,remaining);};
events.onerror=()=>{box.hidden=true;};
</script></html>
