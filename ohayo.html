<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Ohayo Counter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  #counter {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 18px;
    padding: 12px 18px;
    border-radius: 18px;
    background: rgba(12, 18, 28, 0.82);
    color: #fff;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.36);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
  }

  .sun {
    display: inline-block;
    font-size: 32px;
    line-height: 1;
    color: #ffd84d;
    text-shadow: 0 0 8px rgba(255, 216, 77, 0.8), 0 0 16px rgba(255, 162, 40, 0.55);
    animation: sunFloat 3.2s ease-in-out infinite, sunSpin 8s linear infinite;
    transform-origin: center;
  }

  .label {
    font-size: 28px;
    font-weight: 700;
    color: #ffe08a;
  }

  .count {
    min-width: 2ch;
    font-size: 52px;
    line-height: 1;
    font-weight: 800;
    text-align: right;
    color: #8ef0ff;
  }

  .count.pop {
    animation: countPop 0.38s ease-out;
  }

  .unit {
    font-size: 24px;
    font-weight: 700;
  }

  @keyframes sunFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.06); }
  }

  @keyframes sunSpin {
    from { rotate: 0deg; }
    to { rotate: 360deg; }
  }

  @keyframes countPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
  <div id="counter">
    <span class="sun" aria-hidden="true">☀</span>
    <span class="label">おはよう</span>
    <span class="count" id="count">0</span>
    <span class="unit">人</span>
  </div>

<script>
  const countEl = document.getElementById("count");

  async function refresh() {
    try {
      const res = await fetch("/api/ohayo");
      if (!res.ok) return;
      const data = await res.json();
      const next = String(data.count ?? 0);
      if (countEl.textContent !== next) {
        countEl.textContent = next;
        countEl.classList.remove("pop");
        void countEl.offsetWidth;
        countEl.classList.add("pop");
      }
    } catch (e) {
      console.error("ohayo refresh error", e);
    }
  }

  setInterval(refresh, 1000);
  refresh();
</script>
</body>
</html>
